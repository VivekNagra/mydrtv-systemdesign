name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (none yet)
        run: echo "Add tests later (unit tests per service/domain)."

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start compose
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Smoke check health
        run: |
          curl -f http://localhost:8081/health
          curl -f http://localhost:8082/health
          curl -f http://localhost:8083/health
          curl -f http://localhost:8084/health
          curl -f http://localhost:8085/health

      - name: Shutdown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
